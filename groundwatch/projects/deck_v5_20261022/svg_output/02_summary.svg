  <g id="title" data-pptx-bounds="56 80 1168 56" letter-spacing="-1">
    <text x="56" y="120" font-size="40" font-weight="bold" fill="#0B1E3C">GroundWatch는 탐사와 탐사 ‘사이’의 공백을 메웁니다</text>
