    <text x="56" y="282" font-size="17" fill="#374151">법정 점검 5년, 서울 1년.<tspan x='56' dy='22'>그 사이 자라는 얕은 공동을</tspan><tspan x='56' dy='22'>아무도 보지 못합니다.</tspan></text>
