    <text x="784" y="310" font-size="16" fill="#374151">(발견 후 209~989일 · 인천대 연구, 2020)</text>
    <line x1="784" y1="338" x2="1224" y2="338" stroke="#E2E6EC" stroke-width="1" />
    <text x="784" y="372" font-size="17" fill="#111827"><tspan font-weight="bold" fill="#C62828">1년이 안 돼</tspan> ‘관찰’ → ‘우선복구’로 등급 상승</text>
    <text x="784" y="398" font-size="17" fill="#111827">13곳은 크기와 함께 관리 등급도 바뀜</text>
    <line x1="784" y1="426" x2="1224" y2="426" stroke="#E2E6EC" stroke-width="1" />
    <text x="784" y="460" font-size="17" fill="#111827">연희동 공동을 놓쳤는지, 그 뒤 생겼는지는</text>
    <text x="784" y="486" font-size="17" font-weight="bold" fill="#0B1E3C">한 번의 탐사로는 구분할 수 없습니다.</text>
    <line x1="784" y1="514" x2="1224" y2="514" stroke="#E2E6EC" stroke-width="1" />
    <text x="784" y="548" font-size="17" fill="#111827">전국 공동 1,111곳 중 <tspan font-weight="bold" fill="#0B1E3C">385곳(34.7%)이 복구 전</tspan></text>
    <text x="784" y="572" font-size="15" fill="#374151">2022~2026.6 · 찾은 뒤에도 다시 봐야 할 곳이 쌓여 있습니다</text>
  </g>
  <g id="conclusion" data-pptx-bounds="56 596 1168 44">
    <rect x="56" y="596" width="4" height="44" fill="#F5B700" />
    <text x="76" y="626" font-size="21" font-weight="bold" fill="#0B1E3C">한 번의 탐사는 그 시점만 말해 줍니다. 그 사이의 ‘변화’를 봐야 합니다.</text>
