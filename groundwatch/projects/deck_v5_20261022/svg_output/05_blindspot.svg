    <text x="103" y="496" font-size="26" font-weight="bold" fill="#C62828">100여 일</text>
    <text x="56" y="538" font-size="15" fill="#374151">공사장 주변은 2026년부터 주·월 1회 탐사하지만, 회차마다 따로 판독합니다.</text>
    <text x="56" y="560" font-size="15" fill="#374151">사고 뒤 정한 성산로 월 1회 탐사도 계약 절차로 반년 넘게 시행되지 못했습니다.</text>
