  <g id="title" data-pptx-bounds="56 80 1168 56" letter-spacing="-1">
    <text x="56" y="120" font-size="40" font-weight="bold" fill="#0B1E3C">맹점은 탐사가 아니라, 탐사와 탐사 ‘사이’입니다</text>
  </g>
  <g id="gap-chart" data-pptx-bounds="56 168 680 400">
    <rect x="56" y="168" width="680" height="3" fill="#0B1E3C" />
    <text x="56" y="204" font-size="15" font-weight="bold" fill="#B45309">한 번 탐사한 도로를 다시 보기까지</text>
    <text x="56" y="256" font-size="18" fill="#111827">법정 공동조사 주기 <tspan font-size="15" fill="#374151">(하수관 등 관리자)</tspan></text>
    <rect x="56" y="270" width="600" height="34" fill="#9AA3AF" />
    <text x="668" y="296" font-size="26" font-weight="bold" fill="#111827">5년</text>
    <text x="56" y="356" font-size="18" fill="#111827">서울시가 줄이기로 한 정기점검 주기 <tspan font-size="15" fill="#374151">(2025.4 발표)</tspan></text>
    <rect x="56" y="370" width="120" height="34" fill="#0B1E3C" />
