    <text x="820" y="350" font-size="17" fill="#111827">시뮬레이션 통과(7장) → 공동 모사체 실측</text>
    <line x1="56" y1="368" x2="1224" y2="368" stroke="#E2E6EC" stroke-width="1" />
    <text x="56" y="398" font-size="15" font-weight="bold" fill="#4B5563">4</text>
    <text x="80" y="398" font-size="19" font-weight="bold" fill="#0B1E3C">밤에 AR이 정확히 맞는가</text>
    <text x="520" y="398" font-size="17" fill="#C62828">현장 탐색 범위가 커짐</text>
    <text x="820" y="398" font-size="17" fill="#111827">맨홀·경계석 기준점 오차 측정</text>
