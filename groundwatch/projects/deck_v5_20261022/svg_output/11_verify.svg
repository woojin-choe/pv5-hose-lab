  <g id="title" data-pptx-bounds="56 80 1168 56" letter-spacing="-1">
    <text x="56" y="120" font-size="40" font-weight="bold" fill="#0B1E3C">남은 질문은 4가지, 4단계로 실증합니다</text>
  </g>
  <g id="lead" data-pptx-bounds="56 138 1168 28">
    <text x="56" y="160" font-size="19" fill="#374151">공동이 단기간에 자랄 수 있다는 것은 연구로 확인됐습니다(5장). 남은 건 <tspan font-weight="bold" fill="#0B1E3C">PV5에 실었을 때도 정확한가</tspan>입니다.</text>
  </g>
  <g id="questions" data-pptx-bounds="56 186 1168 236">
    <g font-size="15" font-weight="bold" fill="#4B5563">
