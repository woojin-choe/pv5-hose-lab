      <text x="520" y="206">안 되면</text>
      <text x="820" y="206">어떻게 확인하나</text>
    </g>
    <line x1="56" y1="216" x2="1224" y2="216" stroke="#0B1E3C" stroke-width="1.5" />
    <text x="56" y="254" font-size="15" font-weight="bold" fill="#4B5563">1</text>
    <text x="80" y="254" font-size="19" font-weight="bold" fill="#0B1E3C">EV 구동계와 GPR의 전자파 간섭</text>
    <text x="520" y="254" font-size="17" fill="#C62828">차량에서 측정 자체가 불가</text>
