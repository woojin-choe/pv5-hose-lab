  <g id="source" data-pptx-bounds="56 668 1168 20">
    <text x="56" y="682" font-size="13" fill="#4B5563">인허가: 도로 영상은 개인정보보호법 제25조의2(2023.9)대로 차량 외부 표시 · GPR 전파 적합성평가·튜닝 승인은 사업화 전 확인 · 출처: 일본 국토교통성 연구(2021)</text>
