<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="ko-KR" data-pptx-page-role="content" font-family="Pretendard, 'Malgun Gothic', sans-serif">
  <rect id="bg" x="0" y="0" width="1280" height="720" fill="#0B1E3C" />
  <defs>
    <linearGradient id="storyFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B1E3C" stop-opacity="0.94" />
      <stop offset="45%" stop-color="#0B1E3C" stop-opacity="0.66" />
      <stop offset="78%" stop-color="#0B1E3C" stop-opacity="0.15" />
    </linearGradient>
    <linearGradient id="storyFoot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1E3C" stop-opacity="0" />
      <stop offset="100%" stop-color="#0B1E3C" stop-opacity="0.85" />
    </linearGradient>
  </defs>
  <rect id="story-bg" x="0" y="0" width="1280" height="720" fill="#0B1E3C" />
  <image id="story-photo" data-pptx-role="background" href="../images/cover_hangang.jpg" x="0" y="0" width="1280" height="720" preserveAspectRatio="xMidYMid slice" />
  <rect id="story-scrim" data-pptx-role="decoration" x="0" y="0" width="1280" height="720" fill="url(#storyFade)" />
  <rect id="story-foot-scrim" data-pptx-role="decoration" x="0" y="600" width="1280" height="120" fill="url(#storyFoot)" />
  <g id="story-brand" data-pptx-bounds="64 32 400 24">
    <text x="64" y="50" font-size="14" font-weight="bold" fill="#D6DDE8">PV5 GroundWatch</text>
  </g>
  <g id="story-text" data-pptx-bounds="64 150 700 440">
    <text x="64" y="214" font-size="26" font-weight="normal" fill="#D6DDE8" letter-spacing="0">그래서, 같은 길을 다시 달립니다.</text>
    <text x="64" y="316" font-size="76" font-weight="bold" fill="#FFFFFF" letter-spacing="-1">PV5</text>
    <text x="64" y="396" font-size="64" font-weight="bold" fill="#FFFFFF" letter-spacing="-1">GroundWatch</text>
    <text x="64" y="452" font-size="30" font-weight="bold" fill="#D7DEE8" letter-spacing="0">PV5 지하안전 순찰차</text>
    <text x="64" y="512" font-size="21" font-weight="normal" fill="#D6DDE8" letter-spacing="0">약 2개월마다 도로 아래를 다시 재고,</text>
    <text x="64" y="544" font-size="21" font-weight="normal" fill="#D6DDE8" letter-spacing="0">지난 기록과 달라진 곳을 찾습니다.</text>
  </g>
  <g id="footer" data-pptx-role="footer" data-pptx-bounds="64 676 1160 28">
    <text x="64" y="696" font-size="14" font-weight="bold" fill="#F5B700">TEAM 한 명이라도 살릴 수 있다면</text>
    <text x="1224" y="696" font-size="13" fill="#D6DDE8" text-anchor="end">PV5 기반 콘셉트 이미지  ·  08 / 18</text>
  </g>
</svg>
