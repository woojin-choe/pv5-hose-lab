  <g id="hero" data-pptx-bounds="56 420 1168 170">
    <rect x="56" y="420" width="1168" height="3" fill="#FFFFFF" />
    <text x="56" y="526" font-size="88" font-weight="bold" fill="#FFFFFF" letter-spacing="-3">2.4배</text>
