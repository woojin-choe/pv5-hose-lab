  <g id="source" data-pptx-bounds="56 668 1168 20">
    <text x="56" y="682" font-size="13" fill="#8E9AAB">시뮬레이션: 2D 전자기 파동 계산(FDTD) · 400MHz · Ø0.8m 하수관 위 공동 반경 18cm 기준 · 세기 = 회차 차분 에너지 ÷ 가장 큰 오탐 요인 · 판정은 전문가, 확정은 천공</text>
