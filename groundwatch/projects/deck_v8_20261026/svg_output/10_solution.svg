    <text x="441" y="261" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">−</text>
    <image href="../images/sim_cur.png" x="460" y="156" width="360" height="186" preserveAspectRatio="none" />
    <text x="460" y="368" font-size="16" font-weight="bold" fill="#FFFFFF">같은 길을 다시 찍으면</text>
    <text x="460" y="390" font-size="15" fill="#C3CBD8">공동이 20cm 자라 있음</text>
    <rect x="468" y="164" width="95" height="26" rx="3" fill="#0B1E3C" fill-opacity="0.9" />
    <text x="478" y="182" font-size="15" font-weight="bold" fill="#FFFFFF">이번 회차</text>
    <text x="845" y="261" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">=</text>
    <image href="../images/sim_diff.png" x="864" y="156" width="360" height="186" preserveAspectRatio="none" />
    <text x="864" y="368" font-size="16" font-weight="bold" fill="#FFFFFF">위치를 맞춰 빼면 변화만 남음</text>
