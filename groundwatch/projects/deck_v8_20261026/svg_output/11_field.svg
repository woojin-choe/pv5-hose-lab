<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="ko-KR" data-pptx-page-role="content" font-family="Pretendard, 'Malgun Gothic', sans-serif">
  <rect id="bg" x="0" y="0" width="1280" height="720" fill="#0B1E3C" />
  <defs>
    <linearGradient id="storyFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B1E3C" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#0B1E3C" stop-opacity="0.63" />
      <stop offset="78%" stop-color="#0B1E3C" stop-opacity="0.15" />
    </linearGradient>
    <linearGradient id="storyFoot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1E3C" stop-opacity="0" />
      <stop offset="100%" stop-color="#0B1E3C" stop-opacity="0.85" />
    </linearGradient>
  </defs>
  <rect id="story-bg" x="0" y="0" width="1280" height="720" fill="#0B1E3C" />
  <image id="story-photo" data-pptx-role="background" href="../images/story_field.jpg" x="0" y="0" width="1280" height="720" preserveAspectRatio="xMidYMid slice" />
  <rect id="story-scrim" data-pptx-role="decoration" x="0" y="0" width="1280" height="720" fill="url(#storyFade)" />
  <rect id="story-foot-scrim" data-pptx-role="decoration" x="0" y="600" width="1280" height="120" fill="url(#storyFoot)" />
  <g id="chapter" data-pptx-bounds="56 36 600 30">
    <rect x="56" y="44" width="28" height="4" fill="#F5B700" />
    <text x="96" y="52" font-size="16" font-weight="bold" fill="#F5B700">해법<tspan fill="#8E9AAB" font-weight="normal">   현장 재확인</tspan></text>
  </g>
  <g id="story-text" data-pptx-bounds="64 150 700 440">
    <text x="64" y="262" font-size="48" font-weight="bold" fill="#FFFFFF" letter-spacing="-1">의심 지점은</text>
    <text x="64" y="324" font-size="48" font-weight="bold" fill="#FFFFFF" letter-spacing="-1">사람이 직접 재측정합니다.</text>
    <text x="64" y="404" font-size="21" font-weight="normal" fill="#D6DDE8" letter-spacing="0">전문가가 승인한 지점에 도착하면,</text>
    <text x="64" y="436" font-size="21" font-weight="normal" fill="#D6DDE8" letter-spacing="0">같은 차에 실린 수동 GPR로 다른 주파수와 방향에서 다시 측정합니다.</text>
    <text x="64" y="500" font-size="21" font-weight="bold" fill="#FFFFFF" letter-spacing="0">AR 글래스는 재측정 범위만 안내합니다.</text>
    <text x="64" y="560" font-size="16" font-weight="normal" fill="#D6DDE8" letter-spacing="0">2인 1조 운영 · 운전자는 주행 중 AR 미사용 · 공동 확정은 천공 등 정밀 확인</text>
  </g>
  <g id="footer" data-pptx-role="footer" data-pptx-bounds="64 676 1160 28">
    <text x="64" y="696" font-size="14" font-weight="bold" fill="#F5B700"></text>
    <text x="1224" y="696" font-size="13" fill="#D6DDE8" text-anchor="end">연출 이미지  ·  11 / 18</text>
  </g>
</svg>
