  <g id="source" data-pptx-bounds="56 656 1168 34">
    <text x="56" y="668" font-size="12" fill="#4B5563">출처: 기아 PV5 카고 가격표(2026.10.1)·제원 · 오토뷰(2026, PV5 공식 컨버전 파트너·포털) · 스타리아 일렉트릭 출시(2026.4.23) · 2026 ST1 출시(2025.7.16)·현대차그룹 뉴스룸(317km)<tspan x="56" dy="16">포터II·봉고III EV 2025년형 발표(217km) · 시사저널(2025.4.25, 경기도청 인용 GPR 대당 2억~8억 원) · 가격은 표기한 트림 기준, 보조금 제외</tspan></text>
