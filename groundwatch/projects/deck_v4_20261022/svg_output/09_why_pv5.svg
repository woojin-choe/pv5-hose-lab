<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="ko-KR" data-pptx-page-role="content" font-family="Pretendard, 'Malgun Gothic', sans-serif">
  <rect id="bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF" />
  <g id="header" data-pptx-role="header" data-pptx-bounds="56 24 1168 40">
    <rect x="56" y="28" width="140" height="24" fill="#0B1E3C" />
    <text x="126" y="45" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">PV5 GroundWatch</text>
    <rect x="196" y="28" width="57" height="24" fill="#F5B700" />
    <text x="224.5" y="45" font-size="13" font-weight="bold" fill="#0B1E3C" text-anchor="middle">솔루션</text>
    <text x="265" y="45" font-size="14" fill="#374151">왜 PV5인가 · 전기 상용차 비교</text>
    <line x1="56" y1="62" x2="1224" y2="62" stroke="#0B1E3C" stroke-width="1" />
  </g>
  <g id="title" data-pptx-bounds="56 80 1168 56" letter-spacing="-1">
    <text x="56" y="118" font-size="38" font-weight="bold" fill="#0B1E3C">같은 조건의 전기 밴 중에서 PV5가 탐사실로 가장 맞습니다</text>
  </g>
  <g id="lead" data-pptx-bounds="56 137 1168 28">
    <text x="56" y="158" font-size="18" fill="#374151">공공기관은 새 차를 전기·수소차로 사야 합니다. 그래서 비교 대상은 전기 상용차이고, 공식 수치로만 비교했습니다.</text>
  </g>
  <g id="common" data-pptx-bounds="56 182 344 330">
    <rect x="56" y="182" width="344" height="330" fill="#F3F5F8" />
    <text x="76" y="212" font-size="15" font-weight="bold" fill="#4B5563">전기 밴이면 모두 충족하는 조건</text>
    <text x="76" y="250" font-size="20" font-weight="bold" fill="#0B1E3C">공공 무공해차 의무구매</text>
    <text x="76" y="276" font-size="15" fill="#111827">신규 구매·임차 차량 100%를<tspan x="76" dy="21">전기·수소차로 (승합·화물 포함,</tspan><tspan x="76" dy="21">특수·긴급차 등만 예외)</tspan></text>
    <line x1="76" y1="350" x2="380" y2="350" stroke="#D5DAE1" stroke-width="1" />
    <text x="76" y="384" font-size="20" font-weight="bold" fill="#0B1E3C">새벽 정차 중 공회전 없음</text>
    <text x="76" y="410" font-size="15" fill="#111827">서울 공회전 제한장소 2,772곳,<tspan x="76" dy="21">5~25℃에서 2분 넘으면 과태료 5만 원</tspan><tspan x="76" dy="21">→ 시동 없이 장비를 켜 둘 수 있음</tspan></text>
    <text x="76" y="496" font-size="14" font-weight="bold" fill="#8A5A00">PV5만의 장점으로 내세우지 않습니다</text>
  </g>
  <g id="compare" data-pptx-bounds="424 182 800 330">
    <rect x="576" y="182" width="162" height="330" fill="#FFF6D6" />
    <rect x="576" y="182" width="162" height="4" fill="#F5B700" />
    <g font-size="15" font-weight="bold">
      <text x="590" y="212" fill="#0B1E3C">PV5 카고</text>
      <text x="590" y="232" font-size="13" font-weight="normal" fill="#374151">롱 · 롱레인지</text>
      <text x="752" y="212" fill="#374151">스타리아 일렉트릭</text>
      <text x="752" y="232" font-size="13" font-weight="normal" fill="#374151">카고 3인승</text>
      <text x="912" y="212" fill="#374151">ST1</text>
