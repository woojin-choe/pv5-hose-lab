      <text x="1072" y="212" fill="#374151">포터II·봉고III</text>
      <text x="1072" y="232" font-size="13" font-weight="normal" fill="#374151">EV (2025년형~)</text>
    </g>
    <line x1="424" y1="246" x2="1224" y2="246" stroke="#0B1E3C" stroke-width="1.5" />
    <g font-size="15" font-weight="bold" fill="#374151">
      <text x="424" y="296">차량 가격</text>
      <text x="424" y="378">1회 충전</text>
      <text x="424" y="456">적재 공간</text>
    </g>
    <g fill="#111827">
      <text x="590" y="298" font-size="24" font-weight="bold" fill="#0B1E3C">4,520만 원</text>
      <text x="752" y="298" font-size="21">5,792만 원</text>
      <text x="912" y="298" font-size="21">5,874만 원</text>
      <text x="1072" y="298" font-size="15" fill="#4B5563">비교 제외</text>
      <line x1="424" y1="332" x2="1224" y2="332" stroke="#E2E6EC" stroke-width="1" />
      <text x="590" y="380" font-size="24" font-weight="bold" fill="#0B1E3C">377km</text>
      <text x="752" y="380" font-size="21" font-weight="bold" fill="#C62828">387km</text>
      <text x="912" y="380" font-size="21">317km</text>
      <text x="1072" y="380" font-size="21">217km</text>
      <line x1="424" y1="414" x2="1224" y2="414" stroke="#E2E6EC" stroke-width="1" />
      <text x="590" y="450" font-size="16" font-weight="bold" fill="#0B1E3C">밀폐 카고룸 4,420L<tspan x="590" dy="21" font-weight="normal" font-size="14" fill="#374151">적재고 419mm</tspan><tspan x="590" dy="20" font-weight="normal" font-size="14" fill="#374151">V2L·L-Track 장착</tspan></text>
      <text x="752" y="456" font-size="16">밀폐 카고</text>
      <text x="912" y="456" font-size="16">밀폐 카고 박스</text>
      <text x="1072" y="450" font-size="16">개방형 적재함<tspan x="1072" dy="21" font-size="14" fill="#374151">탑 개조 필요</tspan></text>
    </g>
  </g>
  <g id="drawbacks" data-pptx-bounds="56 528 1168 54">
    <text x="56" y="550" font-size="16" font-weight="bold" fill="#C62828">PV5가 불리한 점</text>
    <text x="200" y="550" font-size="16" fill="#111827">주행거리는 스타리아보다 10km 짧고, 전폭 1,895mm는 포터·봉고(1,740mm)보다 155mm 넓습니다.</text>
    <text x="200" y="574" font-size="16" fill="#111827">→ 하루 순찰 약 30km·장비 약 300kg <tspan fill="#4B5563">[가설]</tspan>이면 377km·최대 적재 600kg 안에서 충분히 운용됩니다.</text>
  </g>
  <g id="conclusion" data-pptx-bounds="56 596 1168 52">
    <rect x="56" y="596" width="1168" height="52" fill="#0B1E3C" />
    <text x="80" y="629" font-size="20" font-weight="bold" fill="#FFFFFF">조건은 같고, <tspan fill="#F5B700">도입비는 가장 낮으며</tspan>, 탐사실에 필요한 전원·고정 구조를 <tspan fill="#F5B700">순정으로</tspan> 제공합니다.</text>
  </g>
  <g id="source" data-pptx-bounds="56 656 1168 34">
    <text x="56" y="668" font-size="12" fill="#4B5563">출처: 기아 PV5 카고 가격표(2026.10.1 기준)·제원 · 현대차 스타리아 일렉트릭 출시(2026.4.23) · 2026 ST1 출시(2025.7.16)·현대차그룹 뉴스룸(317km) · 현대차·기아 포터II·봉고III EV 2025년형 발표<tspan x="56" dy="16">산업통상부 공공부문 무공해차 의무구매(2026.6.30) · 서울시 자동차 공회전 제한(제한장소 2,772곳, 2020.12) · 가격은 표기한 트림 기준, 보조금 제외 · 포터·봉고는 적재함 개조가 필요해 가격 비교 제외</tspan></text>
  </g>
  <g id="footer" data-pptx-role="footer" data-pptx-bounds="56 692 1168 22" fill="#4B5563" font-size="12">
