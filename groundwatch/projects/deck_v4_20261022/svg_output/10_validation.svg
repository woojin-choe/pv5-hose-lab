<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="ko-KR" data-pptx-page-role="content" font-family="Pretendard, 'Malgun Gothic', sans-serif">
  <rect id="bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF" />
  <g id="header" data-pptx-role="header" data-pptx-bounds="56 24 1168 40">
    <rect x="56" y="28" width="140" height="24" fill="#0B1E3C" />
    <text x="126" y="45" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">PV5 GroundWatch</text>
    <rect x="196" y="28" width="44" height="24" fill="#F5B700" />
    <text x="218" y="45" font-size="13" font-weight="bold" fill="#0B1E3C" text-anchor="middle">검증</text>
    <text x="252" y="45" font-size="14" fill="#374151">기술 근거와 실증 항목</text>
    <line x1="56" y1="62" x2="1224" y2="62" stroke="#0B1E3C" stroke-width="1" />
  </g>
  <g id="title" data-pptx-bounds="56 80 1168 56" letter-spacing="-1">
    <text x="56" y="118" font-size="38" font-weight="bold" fill="#0B1E3C">반복 탐사의 효과는 연구로 확인됐고, 차량 통합은 실증합니다</text>
  </g>
  <g id="evidence" data-pptx-bounds="56 140 1168 112">
    <rect x="56" y="140" width="1168" height="112" fill="#0B1E3C" />
    <text x="80" y="170" font-size="15" font-weight="bold" fill="#F5B700">근거 · 일본 국토교통성 위탁연구(도쿄대·지오서치, 2018~2020)</text>
    <text x="80" y="204" font-size="22" font-weight="bold" fill="#FFFFFF">같은 도로를 반복 조사하자 <tspan fill="#F5B700">예상보다 빨리 자라는 공동</tspan>이 확인됐습니다.</text>
    <text x="80" y="234" font-size="16" fill="#D6DDE8">지하 1.64m 하수관(Φ800) 위 공동이 급격히 성장 · 관 내부 카메라로 안 보이는 경미한 손상도 원인 · 성장 속도 정량화는 과제</text>
  </g>
  <g id="matrix" data-pptx-bounds="56 268 1168 266">
    <g font-size="14" font-weight="bold" fill="#4B5563">
      <text x="56" y="288">먼저 실증할 4가지</text>
      <text x="380" y="288">실패하면</text>
      <text x="700" y="288">어떻게 확인하나</text>
      <text x="1080" y="288">실증 단계</text>
    </g>
    <line x1="56" y1="298" x2="1224" y2="298" stroke="#0B1E3C" stroke-width="1.5" />
    <g font-size="16" fill="#111827">
      <text x="56" y="330" font-weight="bold" fill="#0B1E3C">EV 구동계 × GPR 전자파 간섭</text>
      <text x="380" y="330" fill="#C62828">차량형 측정 자체가 불가</text>
      <text x="700" y="330">주행·정차·V2L 상태별 잡음 비교</text>
      <text x="1080" y="330" font-weight="bold">1단계</text>
      <line x1="56" y1="348" x2="1224" y2="348" stroke="#E2E6EC" stroke-width="1" />
      <text x="56" y="380" font-weight="bold" fill="#0B1E3C">회차별 위치 정합</text>
      <text x="380" y="380" fill="#C62828">변화 비교가 불가</text>
      <text x="700" y="380">RTK·IMU·휠 인코더 · 시계열 3D GPR 정합</text>
      <text x="1080" y="380" font-weight="bold">2단계</text>
      <line x1="56" y1="398" x2="1224" y2="398" stroke="#E2E6EC" stroke-width="1" />
      <text x="56" y="430" font-weight="bold" fill="#0B1E3C">AI 변화 탐지율·오탐률</text>
      <text x="380" y="430" fill="#C62828">재확인 출동이 과다</text>
      <text x="700" y="430">공동 모사체 구간 · 계절별 함수비 보정</text>
      <text x="1080" y="430" font-weight="bold">2~3단계</text>
      <line x1="56" y1="448" x2="1224" y2="448" stroke="#E2E6EC" stroke-width="1" />
      <text x="56" y="480" font-weight="bold" fill="#0B1E3C">야간 AR 위치 오차</text>
      <text x="380" y="480" fill="#C62828">수동 탐색 범위가 커짐</text>
      <text x="700" y="480">맨홀·경계석 기준점, 야간·우천 오차</text>
      <text x="1080" y="480" font-weight="bold">3단계</text>
    </g>
    <text x="56" y="522" font-size="14" fill="#374151"><tspan font-weight="bold" fill="#0B1E3C">이미 상용</tspan>  차량형·수동 GPR · RTK-GNSS·IMU · 노면 카메라 · 엣지 컴퓨터 · GIS 이력 관리 · AAOS 앱 생태계 · 산업용 AR 글래스(RealWear Navigator 520 등)</text>
  </g>
  <g id="regulation" data-pptx-bounds="56 546 1168 92">
    <rect x="56" y="546" width="1168" height="92" fill="#F3F5F8" />
    <text x="76" y="574" font-size="15" font-weight="bold" fill="#8A5A00">인허가 · 법규</text>
    <text x="210" y="574" font-size="15" fill="#111827"><tspan font-weight="bold">도로 영상</tspan>  개인정보보호법 제25조의2(이동형 영상정보처리기기, 2023.9 시행) → 차량 외부에 촬영 사실 표시</text>
    <text x="210" y="599" font-size="15" fill="#111827"><tspan font-weight="bold">GPR 전파</tspan>  국립전파연구원 적합성평가 대상·기준 확인 <tspan fill="#4B5563">[사업화 전 확인]</tspan></text>
    <text x="210" y="624" font-size="15" fill="#111827"><tspan font-weight="bold">차량 장착</tspan>  튜닝 승인 해당 여부를 한국교통안전공단에 확인 · 기아 공식 컨버전 파트너를 거쳐 장착 <tspan fill="#4B5563">[사업화 전 확인]</tspan></text>
  </g>
  <g id="source" data-pptx-bounds="56 650 1168 34">
    <text x="56" y="662" font-size="12" fill="#4B5563">출처: 일본 국토교통성 도로정책 연구 30-5 연구종료보고서(2021)·중간 개요 · Ling et al., Remote Sensing 14(7):1593(2022, 시계열 3D GPR) · 개인정보보호법 제25조의2</text>
    <text x="56" y="678" font-size="12" fill="#4B5563">자동차관리법 시행규칙 제55조(튜닝 승인 대상) · RealWear Navigator 520 제조사 판매가 US$3,750 · HoloLens 2는 2024년 단종으로 제외</text>
  </g>
  <g id="footer" data-pptx-role="footer" data-pptx-bounds="56 692 1168 22" fill="#4B5563" font-size="12">
    <text x="56" y="706">한 명이라도 살릴 수 있다면</text>
    <text x="1224" y="706" text-anchor="end">10 / 16</text>
  </g>
</svg>
