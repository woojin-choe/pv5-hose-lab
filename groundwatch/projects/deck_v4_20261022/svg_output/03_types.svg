    <text x="80" y="636" font-size="20" font-weight="bold" fill="#FFFFFF">한 번의 탐사가 아니라 <tspan fill="#F5B700">회차 사이의 변화</tspan>로, 얕은 공동을 함몰 전에 찾습니다.</text>
  </g>
  <g id="source" data-pptx-bounds="56 664 1168 20">
    <text x="56" y="678" font-size="12" fill="#4B5563">출처: 국토교통부 지반침하 원인 통계(2020~2024, 867건) · 국토교통부 명일동 사고조사 결과(2025.12.3) · 서울시 차량형 GPR 탐사 깊이 약 2m · 단면도는 원리 설명용 도식(깊이 비례 아님)</text>
