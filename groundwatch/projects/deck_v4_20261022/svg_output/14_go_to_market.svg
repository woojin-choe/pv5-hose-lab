      <text x="68" y="498" fill="#111827"><tspan font-weight="bold" fill="#8A5A00">다음 조건</tspan>  기존 장비와 같은 공동 탐지</text>
      <rect x="354" y="476" width="274" height="34" fill="#F3F5F8" />
      <text x="366" y="498" fill="#111827"><tspan font-weight="bold" fill="#8A5A00">다음 조건</tspan>  실증확인서·용역 실적</text>
      <rect x="652" y="476" width="274" height="34" fill="#F3F5F8" />
      <text x="664" y="498" fill="#111827"><tspan font-weight="bold" fill="#8A5A00">다음 조건</tspan>  자치구 2곳 연간 계약 <tspan fill="#4B5563">[목표]</tspan></text>
      <rect x="950" y="476" width="274" height="34" fill="#FFF6D6" />
      <text x="962" y="498" fill="#111827"><tspan font-weight="bold" fill="#8A5A00">목표</tspan>  권역별 PV5 플릿 운영</text>
