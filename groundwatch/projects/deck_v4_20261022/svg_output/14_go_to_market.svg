    <text x="80" y="617" font-size="20" font-weight="bold" fill="#FFFFFF">새 예산이 아니라, <tspan fill="#F5B700">지자체가 이미 쓰는 GPR 탐사 예산</tspan>에서 첫 계약을 만듭니다.</text>
  </g>
  <g id="source" data-pptx-bounds="56 650 1168 36">
    <text x="56" y="662" font-size="12" fill="#4B5563">출처: 나라장터 2026년 GPR 탐사 용역 낙찰(보령 4,558만·안양 8,522만·용인 기흥구 1억 7,736만 원, 2026.5~6 개찰) · 시사저널(2025.4.25, 경기도 GPR 보유 현황)<tspan x="56" dy="16">조달청 혁신제품 지정제도(최대 6년 수의계약) · 서울시 테스트베드서울 2.0(과제당 최대 2억 원, 서울시장 명의 실증확인서) · 단계별 기간은 목표 [가설]</tspan></text>
  </g>
  <g id="footer" data-pptx-role="footer" data-pptx-bounds="56 692 1168 22" fill="#4B5563" font-size="12">
