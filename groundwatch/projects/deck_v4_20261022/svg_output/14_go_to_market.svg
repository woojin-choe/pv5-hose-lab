      <text x="354" y="406">시·군 GPR 탐사 용역 입찰<tspan x="354" dy="24">조사기관과 컨소시엄 참여</tspan><tspan x="354" dy="24">1회 탐사 → 반복 탐사 제안</tspan></text>
