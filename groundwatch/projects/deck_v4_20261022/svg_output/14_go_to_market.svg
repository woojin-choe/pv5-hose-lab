  <g id="partner" data-pptx-bounds="56 532 1168 36">
    <text x="56" y="560" font-size="16" fill="#111827"><tspan font-weight="bold" fill="#0B1E3C">협력 원칙</tspan>  기존 GPR 조사기관은 경쟁자가 아니라 공동 수행 파트너입니다. 탐사 자격·실적은 협력사가, 반복 비교·현장 재확인은 GroundWatch가 맡습니다.</text>
  </g>
  <g id="conclusion" data-pptx-bounds="56 584 1168 52">
