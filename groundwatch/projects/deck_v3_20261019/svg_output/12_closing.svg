<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="ko-KR" data-pptx-page-role="ending" font-family="Pretendard, 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="rowArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#9AA3AF"/>
    </marker>
    <linearGradient id="closeFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B1E3C" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0B1E3C" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect id="bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="header" data-pptx-role="header" data-pptx-bounds="56 24 1168 40">
    <rect x="56" y="28" width="140" height="24" fill="#0B1E3C"/>
    <text x="126" y="45" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">PV5 GroundWatch</text>
    <rect x="196" y="28" width="40" height="24" fill="#F5B700"/>
    <text x="216" y="45" font-size="13" font-weight="bold" fill="#0B1E3C" text-anchor="middle">8p</text>
    <text x="248" y="45" font-size="14" fill="#4B5563">기존 문제와 개선 결과</text>
    <line x1="56" y1="62" x2="1224" y2="62" stroke="#0B1E3C" stroke-width="1"/>
  </g>
  <g id="title" data-pptx-bounds="56 80 1168 56" letter-spacing="-1">
    <text x="56" y="120" font-size="40" font-weight="bold" fill="#0B1E3C">측정 결과가 다음 행동으로 이어지는 지하안전 관리체계</text>
  </g>
  <g id="change-table" data-pptx-bounds="56 146 1168 324">
    <g font-size="15" font-weight="bold">
      <text x="56" y="166" fill="#C62828">기존 문제</text>
      <text x="460" y="166" fill="#0B1E3C">GroundWatch의 해결 방식</text>
      <text x="900" y="166" fill="#6B7280">확인할 개선 지표</text>
    </g>
    <line x1="56" y1="178" x2="1224" y2="178" stroke="#0B1E3C" stroke-width="2"/>
    <g font-size="17" fill="#111827">
      <text x="56" y="206">조사 결과가 시점별 파일로 남는다</text>
      <text x="460" y="206" font-weight="bold" fill="#0B1E3C">같은 경로 데이터를 위치·시간 기준으로 누적</text>
      <text x="900" y="206" fill="#4B5563">시점별 비교가 가능한 도로 비율</text>
      <line x1="56" y1="224" x2="1224" y2="224" stroke="#E2E6EC" stroke-width="1"/>
      <text x="56" y="252">변화 구간을 사람이 다시 찾아야 한다</text>
      <text x="460" y="252" font-weight="bold" fill="#0B1E3C">AI가 변화 후보를 선별, 전문가가 승인</text>
      <text x="900" y="252" fill="#4B5563">전문가 검토시간·후보 적중률</text>
      <line x1="56" y1="270" x2="1224" y2="270" stroke="#E2E6EC" stroke-width="1"/>
      <text x="56" y="298">다음 조사 우선순위가 경험에 의존한다</text>
      <text x="460" y="298" font-weight="bold" fill="#0B1E3C">변화량·신뢰도·주변 위험요인을 함께 표시</text>
      <text x="900" y="298" fill="#4B5563">고위험 구간 재확인 소요시간</text>
      <line x1="56" y1="316" x2="1224" y2="316" stroke="#E2E6EC" stroke-width="1"/>
      <text x="56" y="344">현장에서 과거 측정 위치를 찾기 어렵다</text>
      <text x="460" y="344" font-weight="bold" fill="#0B1E3C">RTK와 현장 기준점으로 AR 검색 범위 표시</text>
      <text x="900" y="344" fill="#4B5563">현장 위치 오차·탐색시간</text>
      <line x1="56" y1="362" x2="1224" y2="362" stroke="#E2E6EC" stroke-width="1"/>
      <text x="56" y="390">넓은 탐사와 정밀조사가 분리된다</text>
      <text x="460" y="390" font-weight="bold" fill="#0B1E3C">차량형 GPR 결과를 수동 GPR 작업으로 바로 전환</text>
      <text x="900" y="390" fill="#4B5563">재방문 횟수·업무 인계시간</text>
      <line x1="56" y1="408" x2="1224" y2="408" stroke="#E2E6EC" stroke-width="1"/>
      <text x="56" y="436">복구 결과가 다음 조사에 덜 반영된다</text>
      <text x="460" y="436" font-weight="bold" fill="#0B1E3C">확인·보수 이력을 4D 지도에 다시 저장</text>
      <text x="900" y="436" fill="#4B5563">보수구간 재검증 완료율</text>
    </g>
    <g stroke="#9AA3AF" stroke-width="1.5">
      <line x1="414" y1="200" x2="444" y2="200" marker-end="url(#rowArrow)"/>
      <line x1="414" y1="246" x2="444" y2="246" marker-end="url(#rowArrow)"/>
      <line x1="414" y1="292" x2="444" y2="292" marker-end="url(#rowArrow)"/>
      <line x1="414" y1="338" x2="444" y2="338" marker-end="url(#rowArrow)"/>
      <line x1="414" y1="384" x2="444" y2="384" marker-end="url(#rowArrow)"/>
      <line x1="414" y1="430" x2="444" y2="430" marker-end="url(#rowArrow)"/>
      <line x1="858" y1="200" x2="888" y2="200" marker-end="url(#rowArrow)"/>
      <line x1="858" y1="246" x2="888" y2="246" marker-end="url(#rowArrow)"/>
      <line x1="858" y1="292" x2="888" y2="292" marker-end="url(#rowArrow)"/>
      <line x1="858" y1="338" x2="888" y2="338" marker-end="url(#rowArrow)"/>
      <line x1="858" y1="384" x2="888" y2="384" marker-end="url(#rowArrow)"/>
      <line x1="858" y1="430" x2="888" y2="430" marker-end="url(#rowArrow)"/>
    </g>
  </g>
  <g id="closing-band" data-pptx-bounds="0 480 1280 240">
    <rect x="0" y="480" width="1280" height="240" fill="#0B1E3C"/>
    <image href="../images/pv5_rear_dawn.jpg" x="760" y="480" width="520" height="240" preserveAspectRatio="xMidYMid slice"/>
    <rect x="760" y="480" width="200" height="240" fill="url(#closeFade)"/>
    <text x="56" y="524" font-size="17" fill="#C3CCD9">GroundWatch의 가치는 지도를 만드는 데서 끝나지 않습니다.<tspan x="56" dy="26">한 번의 측정을 다음 판단과 현장 행동으로 연결합니다.</tspan></text>
    <rect x="56" y="572" width="48" height="3" fill="#F5B700"/>
    <text x="56" y="622" font-size="34" font-weight="bold" fill="#FFFFFF">한 번의 조기 발견이,<tspan x="56" dy="46">한 사람의 무사 귀가가 되도록.</tspan></text>
    <text x="1232" y="704" font-size="13" font-weight="bold" fill="#F5B700" text-anchor="end">TEAM 한 명이라도 살릴 수 있다면 · 12 / 12</text>
  </g>
</svg>
