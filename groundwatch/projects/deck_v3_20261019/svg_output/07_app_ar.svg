  <g id="source" data-pptx-bounds="56 650 1168 40">
    <text x="56" y="664" font-size="12" fill="#6B7280">차량 화면의 단순 미러링이 아닌 보안 Wi-Fi 작업 데이터 연동 · AR은 공동의 실제 모양이 아니라 수동 GPR로 확인할 범위를 안내 · 운전자는 주행 중 AR을 쓰지 않음<tspan x="56" dy="18">앱 배포와 차량 데이터 접근은 기아 PBV 파트너 승인·공식 API 범위 확인 필요 · 도로 사진: PattayaPatrol, CC BY-SA 4.0 · 화면 수치는 예시</tspan></text>
