<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="ko-KR" data-pptx-page-role="content" font-family="Pretendard, 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="downHead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#9AA3AF" />
    </marker>
  </defs>
  <rect id="bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF" />
  <g id="header" data-pptx-role="header" data-pptx-bounds="56 24 1168 40">
    <rect x="56" y="28" width="140" height="24" fill="#0B1E3C" />
    <text x="126" y="45" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">PV5 GroundWatch</text>
    <rect x="196" y="28" width="40" height="24" fill="#F5B700" />
    <text x="216" y="45" font-size="13" font-weight="bold" fill="#0B1E3C" text-anchor="middle">7p</text>
    <text x="248" y="45" font-size="14" fill="#4B5563">B2G 비즈니스 모델</text>
    <line x1="56" y1="62" x2="1224" y2="62" stroke="#0B1E3C" stroke-width="1" />
  </g>
  <g id="title" data-pptx-bounds="56 80 1168 56" letter-spacing="-1">
    <text x="56" y="120" font-size="40" font-weight="bold" fill="#0B1E3C">지자체 탐사 용역으로 시작해 연간 반복관제로 전환한다</text>
  </g>
  <g id="revenue-steps" data-pptx-bounds="56 150 664 360">
    <g id="rev-1">
      <text x="56" y="196" font-size="40" font-weight="bold" fill="#C9D3E2">01</text>
      <text x="132" y="182" font-size="24" font-weight="bold" fill="#0B1E3C">파일럿 탐사 용역</text>
      <text x="132" y="210" font-size="17" fill="#4B5563">위험구간·공사구간의 거리와 회차 기준 계약<tspan x="132" dy="24">기존 조사 결과와 비교한 실증 보고서 제공</tspan></text>
    </g>
    <line x1="80" y1="216" x2="80" y2="268" stroke="#9AA3AF" stroke-width="2" marker-end="url(#downHead)" />
    <g id="rev-2">
      <text x="56" y="316" font-size="40" font-weight="bold" fill="#2E4A78">02</text>
      <text x="132" y="302" font-size="24" font-weight="bold" fill="#0B1E3C">연간 반복관제 계약</text>
      <text x="132" y="330" font-size="17" fill="#4B5563">정기 순찰·변화 감지·재확인 업무·기관용 대시보드<tspan x="132" dy="24">집중호우·민원 발생 시 긴급조사 옵션</tspan></text>
      <rect x="382" y="284" width="112" height="24" rx="4" fill="none" stroke="#C99600" stroke-width="1.5" />
      <text x="438" y="301" font-size="14" font-weight="bold" fill="#8A5A00" text-anchor="middle">핵심 반복 매출</text>
    </g>
    <line x1="80" y1="336" x2="80" y2="388" stroke="#9AA3AF" stroke-width="2" marker-end="url(#downHead)" />
    <g id="rev-3">
      <text x="56" y="436" font-size="40" font-weight="bold" fill="#0B1E3C">03</text>
      <text x="132" y="422" font-size="24" font-weight="bold" fill="#0B1E3C">차량·소프트웨어 패키지</text>
      <text x="132" y="450" font-size="17" fill="#4B5563">검증 이후 PV5 컨버전 차량·센서·Patrol 앱·Edge Gateway<tspan x="132" dy="24">AI 분석·관제 대시보드·AR·교육·유지보수 일괄 제공</tspan></text>
    </g>
