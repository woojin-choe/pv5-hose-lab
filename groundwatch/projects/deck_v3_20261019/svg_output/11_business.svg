  <g id="stakeholders" data-pptx-bounds="760 150 464 360">
    <rect x="760" y="150" width="464" height="360" rx="10" fill="#F3F5F8" />
    <text x="784" y="186" font-size="15" font-weight="bold" fill="#0B1E3C">구매자</text>
    <text x="784" y="212" font-size="17" fill="#111827">서울시·자치구·도시철도 발주기관<tspan x="784" dy="24">공공시설 관리기관</tspan></text>
    <line x1="784" y1="260" x2="1200" y2="260" stroke="#D5DAE1" stroke-width="1" />
    <text x="784" y="292" font-size="15" font-weight="bold" fill="#0B1E3C">실제 사용자</text>
    <text x="784" y="318" font-size="17" fill="#111827">지하안전·도로관리 담당자<tspan x="784" dy="24">GPR 판독 전문가·현장 조사원</tspan></text>
    <line x1="784" y1="366" x2="1200" y2="366" stroke="#D5DAE1" stroke-width="1" />
    <text x="784" y="398" font-size="15" font-weight="bold" fill="#0B1E3C">협력사</text>
    <text x="784" y="424" font-size="17" fill="#111827">GPR 전문기업·PV5 특장업체<tspan x="784" dy="24">GIS·클라우드 사업자·AR 장비사</tspan></text>
  </g>
  <g id="demand" data-pptx-bounds="56 530 1168 70">
    <rect x="56" y="530" width="1168" height="70" fill="#0B1E3C" />
    <text x="80" y="560" font-size="15" font-weight="bold" fill="#F5B700">수요 근거 · 서울시 2026년 계획</text>
    <text x="80" y="588" font-size="22" font-weight="bold" fill="#FFFFFF">GPR 탐사 16,423km · 전담 인력 9명 → 19명으로 확대</text>
    <text x="1200" y="578" font-size="16" fill="#C3CCD9" text-anchor="end">반복 탐사 수요가 이미 늘고 있습니다</text>
  </g>
  <g id="procurement" data-pptx-bounds="56 610 1168 52" fill="#111827" font-size="16">
    <text x="56" y="630"><tspan font-weight="bold">조달 접근</tspan>  첫 계약은 기존 GPR 조사기관과 공동 수행해 실적과 신뢰를 확보하고, 한 위험구간 입증 후 인접 구역으로 확장</text>
    <text x="56" y="654"><tspan font-weight="bold">가격</tspan>  일일 조사거리·인력·장비 감가·분석시간을 확인한 뒤 산정 <tspan fill="#6B7280">[실증 필요]</tspan></text>
  </g>
  <g id="source" data-pptx-bounds="56 668 1168 20">
    <text x="56" y="682" font-size="12" fill="#6B7280">출처: 서울시 보도자료 「지반침하 예방체계 강화」 · 지하정보는 제3자에게 판매하지 않고 계약기관 접근제어형 서비스로 제공</text>
  </g>
  <g id="footer" data-pptx-role="footer" data-pptx-bounds="56 692 1168 22" fill="#6B7280" font-size="12">
    <text x="56" y="706">한 명이라도 살릴 수 있다면</text>
    <text x="1224" y="706" text-anchor="end">11 / 12</text>
  </g>
